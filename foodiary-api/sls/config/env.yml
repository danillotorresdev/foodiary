# Cognito
COGNITO_CLIENT_ID: !Ref UserPoolClient
COGNITO_CLIENT_SECRET: !GetAtt UserPoolClient.ClientSecret
COGNITO_POOL_ID: !Ref UserPool

# Database
MAIN_TABLE_NAME: !Ref MainTable

# Buckets
MEALS_BUCKET: !Ref MealsBucket

# CDN: com MealsBucketCDN.yml desligado, URLs usam o host regional do bucket.
# Ao descomentar CloudFront em serverless.yml, troque por:
#   !If [ShouldSetupMealsCDNCustomDomain, ${env:MEALS_CDN_DOMAIN_NAME, ''}, !GetAtt MealsBucketCDN.DomainName]
# (a condição ShouldSetupMealsCDNCustomDomain está em sls/resources/MealsBucketCDN.yml)
MEALS_CDN_DOMAIN_NAME: !GetAtt MealsBucket.RegionalDomainName

# Queues
MEALS_QUEUE_URL: !Ref MealsQueue
